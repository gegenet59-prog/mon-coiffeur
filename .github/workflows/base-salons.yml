# Base des salons : fusion de départ SIRENE + OpenStreetMap (à la main), puis mise à jour chaque lundi.
# Les données vivent sur la branche « donnees » (un seul commit, remplacé à chaque fois : le dépôt ne grossit pas).
name: Base des salons

on:
  schedule:
    - cron: "17 3 * * 1"   # chaque lundi vers 4h-5h (heure de Paris)
  workflow_dispatch:
    inputs:
      mode:
        description: "initial = fusion complète depuis le gros fichier SIRENE ; hebdo = mise à jour de la semaine"
        default: hebdo
        type: choice
        options: [hebdo, initial]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  base:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb pyproj
      - name: Reprendre la base existante (branche donnees)
        run: git clone --depth 1 --branch donnees "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data || mkdir -p data
      - name: Télécharger les salons OpenStreetMap de France
        run: python3 scripts/osm.py /tmp/osm.json
      - name: Fusion de départ (gros fichier SIRENE, une seule fois)
        if: inputs.mode == 'initial' || hashFiles('data/sirene.json') == ''
        run: |
          curl -sfL -o /tmp/etab.parquet https://www.data.gouv.fr/api/1/datasets/r/a29c1297-1f92-4e2a-8f6b-8c902ce96c5f
          curl -sfL -o /tmp/ul.parquet https://www.data.gouv.fr/api/1/datasets/r/350182c9-148a-46e0-8389-76c2ec1374a3
          ls -lh /tmp/*.parquet
          python3 scripts/fusion.py initial /tmp/etab.parquet /tmp/ul.parquet /tmp/osm.json
      - name: Mise à jour de la semaine
        if: inputs.mode != 'initial' && hashFiles('data/sirene.json') != ''
        env:
          SIRENE_CLE: ${{ secrets.SIRENE_CLE }}
        run: python3 scripts/fusion.py hebdo /tmp/osm.json
      - name: Enregistrer la base sur la branche donnees
        run: |
          cd data && rm -rf .git && git init -q -b donnees
          git -c user.name="Mon coiffeur" -c user.email="actions@github.com" add -A
          git -c user.name="Mon coiffeur" -c user.email="actions@github.com" commit -qm "Base des salons du $(date +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" donnees
          rm -rf .git
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
