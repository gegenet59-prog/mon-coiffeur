# Publie le site sur GitHub Pages à chaque modification
name: Publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Reprendre la base des salons (branche donnees)
        run: git clone --depth 1 --branch donnees "https://github.com/${{ github.repository }}" data && rm -rf data/.git || echo "Pas encore de base"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
